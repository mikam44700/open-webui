services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.fr
      args:
        BUILD_HASH: ${BUILD_HASH:-fr-local}
    image: open-webui-fr:local
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      DEFAULT_LOCALE: fr-FR
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
    name: open-webui
