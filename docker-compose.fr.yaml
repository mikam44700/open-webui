services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.fr
      args:
        BUILD_HASH: ${BUILD_HASH:-fr-local}
    image: open-webui-fr:local
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      DEFAULT_LOCALE: fr-FR
      # Signe les jetons de session. Doit rester stable d'une reconstruction a
      # l'autre : start.sh, faute de valeur ici, ecrit une cle neuve dans
      # /app/backend/.webui_secret_key, qui est hors du volume persistant et
      # disparait avec le conteneur. Chaque rebuild deconnectait tout le monde.
      # La valeur vit dans .env, ignore par git.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY manquant dans .env}
      # Cle d'API pour que le moteur declare ce qu'il fait.
      #
      # Open WebUI ne peut pas observer Telegram : ces traitements partent du
      # moteur sans jamais traverser ce serveur. C'est donc au moteur de les
      # annoncer, par POST /api/v1/journal/.
      #
      # La restriction n'est pas une precaution de forme. Une cle d'API Open
      # WebUI vaut le compte qui l'a creee : sans liste blanche, la cle du
      # moteur pourrait lire toutes les conversations et tout le contenu de
      # l'espace de travail. Bornee au journal, elle ne peut rien d'autre.
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: "/api/v1/journal"
      # Ollama fait tourner des modeles en local sur la machine hote. Il n'est
      # pas installe ici : le moteur, c'est Hermes. Sans ce reglage, Open WebUI
      # sonde localhost:11434 a chaque chargement de page et log une erreur de
      # connexion qui noie les vraies pannes.
      ENABLE_OLLAMA_API: "false"
      HERMES_API_URL: ${HERMES_API_URL:-http://host.docker.internal:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_CONFIG_FILE: /run/secrets/hermes-config.yaml
      HERMES_REQUEST_TIMEOUT: ${HERMES_REQUEST_TIMEOUT:-15}
      # Tableau de bord de Hermes : il tourne sur la machine hote, pas dans un
      # conteneur voisin. Sans lui, les onglets Modeles IA, Comptes et Outils
      # restent vides. Se demarre par : hermes dashboard --port 9119
      HERMES_DASHBOARD_URL: ${HERMES_DASHBOARD_URL:-http://host.docker.internal:9119}
      HERMES_DASHBOARD_USER: ${HERMES_DASHBOARD_USER:-}
      HERMES_DASHBOARD_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:-}
    volumes:
      - open-webui:/app/backend/data
      - ${HERMES_CONFIG_PATH:-/Users/michaelm/.hermes/config.yaml}:/run/secrets/hermes-config.yaml:ro

volumes:
  open-webui:
    name: open-webui
